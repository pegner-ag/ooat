name: Bug report
description: Something in the schemas, catalog, tests or code does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, inputs and output. Remove secrets and personal data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
