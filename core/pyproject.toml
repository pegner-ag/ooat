[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ooat-core"
version = "0.1.0.dev0"
description = "OOAT reference runtime: ledger, contracts and Topology Gate."
readme = "description.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23", "referencing>=0.30", "rfc3339-validator>=0.1.4", "fastapi>=0.143", "uvicorn>=0.54"]

[project.scripts]
ooat = "ooat_core.operator_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ooat_core"]
